experimental_truth:
  primary_sources: [BRENDA, SABIO-RK]
  aggregation: median_raw_kcat_then_log10
  accepted_match_levels:
    - level_1_ec_organism_substrate_wildtype
    - level_2_ec_organism_substrate_uncertain
  supplementary_only:
    - level_3_ec_substrate_cross_species
    - level_4_ec_only
    - level_5_ecmodel_or_fill

deduplication:
  exact_overlap: [protein_sequence, substrate_smiles, kcat_value]
  relaxed_overlap: [uniprot_id, substrate_smiles]
  ec_level_overlap: [ec_number, substrate_name]
